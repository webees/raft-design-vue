name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check:parity
      - run: bun run check:audit
      - run: bun run check:docs-links
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:api
      - run: bun run test -- --coverage
      - run: bun run build
      - run: bun run check:consumer-types
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: packages/ui/coverage
          if-no-files-found: ignore
