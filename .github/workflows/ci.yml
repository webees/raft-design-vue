name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A changesets release PR only edits the version, changelog and changeset
    # files; GitHub also holds bot-authored PR runs at "action required", so
    # don't create one. The push run on main verifies the same tree.
    paths-ignore:
      - "packages/ui/package.json"
      - "packages/ui/CHANGELOG.md"
      - ".changeset/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Fallback if a run is still created for the bot branch: the branch is
    # deleted right after the admin merge, so the job would never finish.
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Fetch pinned upstream snapshot
        run: bun run fetch:upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run check:parity
      - run: bun run check:audit
      - run: bun run check:docs-links
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:api
      - run: bun run check:props
      - run: bun run test -- --coverage
      - run: bun run build
      - run: bun run check:consumer-types
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: packages/ui/coverage
          if-no-files-found: ignore
